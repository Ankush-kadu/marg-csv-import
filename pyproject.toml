[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marg-csv-import"
version = "0.1.0"
description = "Parse stock/inventory CSV exports from Indian pharmacy desktop software (Marg ERP, eVitalRx, Vyapar) into normalized dicts. Stdlib only."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nesayo", email = "hello@nesayo.com" }]
requires-python = ">=3.8"
keywords = ["pharmacy", "csv", "marg", "evitalrx", "vyapar", "inventory", "india", "gst"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = []

[project.urls]
Homepage = "https://nesayo.com"
Repository = "https://github.com/nesayo/marg-csv-import"

[tool.setuptools]
packages = ["marg_csv_import"]
